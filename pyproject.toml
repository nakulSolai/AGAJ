[project]
name = "agaj"
version = "0.1.0"
description = "A personal journal that quietly re-reads itself, surfacing connections you didn't notice."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Nakul Solai", email = "nakulsolai@gmail.com" },
]

dependencies = [
  "google-adk>=2.0",
  "google-cloud-aiplatform[agent-engines]>=1.122",
  "google-genai>=1.21,<2.0",
  "numpy>=1.26",
  # "pandas>=2.0",
  "pydantic>=2.4",
  "python-dotenv>=1.0",
  "sqlite-vec>=0.1.9",
]

[dependency-groups]
dev = [
  "detect-secrets>=1.4",
  "icecream>=2.0",
  "pre-commit>=3.7",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"
# 
# [tool.hatch.build.targets.wheel]
# packages = ["src/AGAJ"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "S", "RUF"]
ignore = ["S101"]  # allow asserts in tests
